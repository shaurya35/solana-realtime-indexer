name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: indexer
          POSTGRES_PASSWORD: indexer
          POSTGRES_DB: indexer
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: format
        run: cargo fmt --all -- --check

      - name: lint
        run: cargo clippy --all-targets -- -D warnings

      # single threaded because the database tests share one schema and
      # truncate it between runs
      - name: test
        run: cargo test -- --test-threads=1
        env:
          TEST_DATABASE_URL: postgres://indexer:indexer@localhost:5432/indexer